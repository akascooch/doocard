# Nginx template — Doocard production
# Path on server: /etc/nginx/sites-available/doocard
# Enable: ln -sf /etc/nginx/sites-available/doocard /etc/nginx/sites-enabled/

upstream doocard_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream doocard_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name www.doocardbarbershop.com doocardbarbershop.com;
    return 301 https://www.doocardbarbershop.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.doocardbarbershop.com;

    # certbot fills these after: certbot --nginx -d www.doocardbarbershop.com -d doocardbarbershop.com
    ssl_certificate     /etc/letsencrypt/live/www.doocardbarbershop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.doocardbarbershop.com/privkey.pem;

    client_max_body_size 15M;

    location /api/ {
        proxy_pass http://doocard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://doocard_backend;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://doocard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://doocard_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
