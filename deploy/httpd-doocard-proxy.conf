# Doocard reverse proxy - persistent include (DirectAdmin-safe via httpd-includes.conf)
# Created: 2026-06-02

<VirtualHost 45.159.114.60:80>
    ServerName www.doocardbarbershop.com
    ServerAlias doocardbarbershop.com
    ServerAdmin webmaster@doocardbarbershop.com

    ErrorLog /var/log/httpd/doocard-error.log
    CustomLog /var/log/httpd/doocard-access.log combined

    # ACME HTTP-01 (Let's Encrypt / DirectAdmin AutoSSL)
    Alias /.well-known /var/www/html/.well-known
    <Directory "/var/www/html/.well-known">
        Require all granted
    </Directory>
    ProxyPass /.well-known !

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    ProxyPass /uploads/ http://127.0.0.1:3001/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3001/uploads/

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /socket.io/(.*) ws://127.0.0.1:3001/socket.io/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /socket.io/(.*) http://127.0.0.1:3001/socket.io/$1 [P,L]

    ProxyPass /socket.io/ ws://127.0.0.1:3001/socket.io/
    ProxyPassReverse /socket.io/ ws://127.0.0.1:3001/socket.io/

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>

<VirtualHost 45.159.114.60:443>
    ServerName www.doocardbarbershop.com
    ServerAlias doocardbarbershop.com
    ServerAdmin webmaster@doocardbarbershop.com

    ErrorLog /var/log/httpd/doocard-ssl-error.log
    CustomLog /var/log/httpd/doocard-ssl-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/httpd/conf/ssl.crt/server.crt.combined
    SSLCertificateKeyFile /etc/httpd/conf/ssl.key/server.key

    Alias /.well-known /var/www/html/.well-known
    <Directory "/var/www/html/.well-known">
        Require all granted
    </Directory>
    ProxyPass /.well-known !

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    ProxyPass /uploads/ http://127.0.0.1:3001/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3001/uploads/

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /socket.io/(.*) ws://127.0.0.1:3001/socket.io/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /socket.io/(.*) http://127.0.0.1:3001/socket.io/$1 [P,L]

    ProxyPass /socket.io/ ws://127.0.0.1:3001/socket.io/
    ProxyPassReverse /socket.io/ ws://127.0.0.1:3001/socket.io/

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
