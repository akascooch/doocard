<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پاکسازی Cache و Service Worker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        .status {
            font-size: 18px;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: #f0f0f0;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .progress {
            background: #cce5ff;
            color: #004085;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #764ba2;
        }
        .log {
            text-align: right;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 پاکسازی Cache</h1>
        <div id="status" class="status progress">در حال بررسی...</div>
        <div id="log" class="log"></div>
        <button onclick="clearEverything()">🔄 پاکسازی دوباره</button>
        <button onclick="goToLogin()">🏠 برو به صفحه ورود</button>
    </div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('fa-IR');
            logDiv.innerHTML += `<div>[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(message, type = 'progress') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        async function clearEverything() {
            log('🚀 شروع پاکسازی...');
            updateStatus('در حال پاکسازی...', 'progress');

            try {
                // 1. Unregister Service Workers
                log('1️⃣ در حال حذف Service Workers...');
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                    await registration.unregister();
                    log(`✅ Service Worker حذف شد: ${registration.scope}`);
                }

                // 2. Clear all caches
                log('2️⃣ در حال پاکسازی Cache...');
                const cacheNames = await caches.keys();
                for (let name of cacheNames) {
                    await caches.delete(name);
                    log(`✅ Cache حذف شد: ${name}`);
                }

                // 3. Clear localStorage
                log('3️⃣ در حال پاکسازی localStorage...');
                localStorage.clear();
                log('✅ localStorage پاک شد');

                // 4. Clear sessionStorage
                log('4️⃣ در حال پاکسازی sessionStorage...');
                sessionStorage.clear();
                log('✅ sessionStorage پاک شد');

                // 5. Clear IndexedDB
                log('5️⃣ در حال پاکسازی IndexedDB...');
                if (window.indexedDB) {
                    const dbs = await window.indexedDB.databases();
                    for (let db of dbs) {
                        if (db.name) {
                            window.indexedDB.deleteDatabase(db.name);
                            log(`✅ Database حذف شد: ${db.name}`);
                        }
                    }
                }

                log('✨ پاکسازی کامل شد!');
                updateStatus('✅ پاکسازی موفق! صفحه در حال بارگذاری مجدد...', 'success');

                // Reload after 2 seconds
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);

            } catch (error) {
                log(`❌ خطا: ${error.message}`);
                updateStatus('❌ خطا در پاکسازی. لطفاً دوباره تلاش کنید.', 'error');
                console.error('Clear error:', error);
            }
        }

        function goToLogin() {
            window.location.href = '/login';
        }

        // Auto-run on page load
        window.addEventListener('load', () => {
            setTimeout(clearEverything, 500);
        });
    </script>
</body>
</html>
